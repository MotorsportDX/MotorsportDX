# Post passes of FM4 for the runtime's post pass framework (post_pass_path):
# screen passes that run inside the guest frame, written as HLSL files and this
# manifest. See docs/analysis/post-pass-framework.md for the format,
# docs/analysis/gtao-design.md for GTAO, docs/analysis/motion-vectors.md for
# the motion vectors, docs/analysis/taa.md for TAA, docs/analysis/fsr-plan.md
# for FSR and docs/analysis/windshield.md for the cockpit glass.

[scene]
# Vertex shaders that carry the scene camera: <ucode hash>:rows:<WVP>:<WV>
# (row vectors, 4 constants each), with :<world> also the view (view to world
# = world * inverse(WV)), or <ucode hash>:world:<WVP>:<world>:<view inverse>
# (column vectors, 4, 3 and 3 constants). The road (the game's own view
# inverse), then the car body paint (matWVP, matWV, matW): in a frame, a source
# earlier in the list replaces the matrices of a later one. The hash * is the
# fallback, last in priority, for any other vertex shader that reads every
# constant of its layout and gives a rotation as its view: 156 of the 162
# vertex shaders with the position at c128 in a 16-car race dump have the
# road's layout (c243 to c245 hold the view inverse). Some frames show neither
# a car nor the road (Tsukuba's bumper camera in the lead). Every source counts
# only on a draw as wide as the scene whose projection has the viewport's
# aspect, which leaves out the rear-view mirror's strip.
camera = [
  "C81F8D92FF6529EB:world:128:140:243",
  "8D05A46C3584CA9E:rows:0:4:8",
  "*:world:128:140:243",
]
# The narrowest depth resolve taken as the scene depth, in guest pixels.
min_width = 1024
# The final combine pixel shaders (with and without depth of field): the final
# point runs before the first draw after them, before the HUD.
final_pixel_shaders = [
  "E97AA211B556A9B3",
  "9CDA139F232A8A73",
  "30B67D8B86C37587",
  "AE3B2E36FCA4958D",
]

[history]
# The previous frame's scene color and depth are kept only when a pass reads
# them. A camera cut drops them: a move of more than cut_distance view units,
# a turn of more than cut_angle degrees, or a focal length change of more
# than cut_focal (relative) from one frame to the next.
cut_distance = 5.0
cut_angle = 30.0
cut_focal = 0.1

[motion]
# The objects of the motion vectors: draws on the scene depth whose stencil
# operation replaces the stencil with their reference, an object ID. FM4 writes
# 0 for the track and 7n for every draw of car n. The vertex shaders of the car
# draws and where their world matrix is (<ucode hash>:rows:<first constant>,
# row vectors in 4 constants, or :columns: in 3): all keep matW in c8-c11. Per
# car, the first one in this list that drew in a frame gives the car's matrix:
# the body first; the wheels (brakes, tires, rims) have one matrix per wheel,
# so they come last.
objects = [
  "8D05A46C3584CA9E:rows:8",  # paint
  "BBD01C26B1C45733:rows:8",  # paint
  "42CB1356564CF9FA:rows:8",  # the rest of the body (the paint's matrix)
  "F936B2AD861F53BE:rows:8",  # glass
  "D7B380C7A7F72EF5:rows:8",  # glass
  "EFE6E73205BB1F64:rows:8",  # lights
  "A7B129D19544EFED:rows:8",  # lights
  "A42BEA3C0A6E5603:rows:8",  # chrome
  "4EE552137CA415E3:rows:8",  # cockpit
  "918AF0171F6F6F4A:rows:8",  # cockpit
  "7B69DF9819BBA422:rows:8",  # brakes
  "8317040277B5F496:rows:8",  # tires
  "C00542278E7CCC25:rows:8",  # rims
]
# The slot of a stencil value s is round(s / stencil_step) below stencil_limit,
# else 0 (the static world): FM4's motion blur rule. The shadow passes turn the
# track's 0 into 128 and 129, which stay slot 0.
stencil_step = 7
stencil_limit = 126
# The cockpit interior: FM4 draws the player's cockpit with its own world
# matrix (the shell 4EE552137CA415E3; the steering wheel and hands
# 918AF0171F6F6F4A have one per part) and then covers it with a mask at the
# stored depth 1.0, so its pixels have the car's stencil ID but no depth of
# their own (motion.hlsl). Other pixels at that depth or within 1% of the near
# plane (the rear-view mirror panel of the hood and bumper cameras) get no
# motion.
interior = ["4EE552137CA415E3:rows:8"]
interior_depth = 1.0

# Compile-time defines of the passes; shader_mod_defines (and shader_mod_set,
# shader_mod_defines.txt) override them by name.
[defines]
# Slices x steps per side: 0 2x2, 1 2x4 (one denoise pass), 2 3x6, 3 4x8 (two).
GTAO_QUALITY = 2
# TAA: the history filtered with Catmull-Rom (1) or bilinear (0), and the
# history dropped where the previous scene depth was clearly nearer (1).
TAA_HISTORY_FILTER = 1
TAA_DISOCCLUSION = 1
# Where TAA runs: 0 at the final point (after the game's post chain, before
# the HUD), 1 at the scene_color point (before the post chain, its output
# written back into the game's scene; the occlusion then gets its own temporal
# filter, gtao_temporal).
TAA_POINT = 0
# With TAA at the scene_color point while upscaling (native_scene_input_scale
# below native_draw_scale; the look's aa=taau): 1 runs TAA as the upscaler
# (taau_resolve, taau_output), its history and output at the scene's output
# size, so the scene at the input scale is reconstructed at the output scale
# from the jittered frames (docs/analysis/fsr-plan.md 14).
TAA_UPSCALE = 0
# The cockpit glass (windshield.hlsl, WINDSHIELD above 0): the tint of the light
# through it, its color, the dashboard's reflection and how far above the
# dashboard's top edge it fades out (frame heights), how much the reflection is
# squashed, the linear luma above which the interior below the window is taken
# as lit from outside (the hood, seen through the glass), the glare of the light
# above the threshold (linear) spread over the radius (frame heights), the dust
# that scatters it, the glare's color, and the least share of the frame the
# interior covers in a cockpit frame. Glare and dust: the middle of three sets
# of an A/B at 2x on 20 October 2026 (docs/analysis/windshield.md).
WINDSHIELD_TINT = 1.0
WINDSHIELD_TINT_COLOR = "float3(0.88, 0.95, 0.93)"
WINDSHIELD_REFLECTION = 0.12
WINDSHIELD_REFLECTION_HEIGHT = 0.3
WINDSHIELD_REFLECTION_SQUASH = 0.6
WINDSHIELD_REFLECTION_HOOD = 0.03
WINDSHIELD_GLARE = 0.3
WINDSHIELD_GLARE_THRESHOLD = 0.3
WINDSHIELD_GLARE_RADIUS = 0.25
WINDSHIELD_DUST = 1.0
WINDSHIELD_GLARE_COLOR = "float3(1.0, 0.95, 0.85)"
WINDSHIELD_MIN_INTERIOR = 0.1
# FSR (fsr.hlsl and the runtime's fsr pass): the view distance in meters at
# which FSR's depth is 1 (FSR_DEPTH_NEAR / W, an inverted projection with an
# infinite far plane); nearer than anything FM4 draws.
FSR_DEPTH_NEAR = 0.01
# The aerial haze (haze.hlsl, the param HAZE above 0): the distance in meters
# over which it reaches 63% of its strength, beyond a clear distance from the
# camera, and the share of its strength on the sky.
HAZE_DISTANCE = 800.0
HAZE_START = 30.0
HAZE_SKY = 0.35

# Run-time params, constants of every pass (b1); shader_mod_defines,
# shader_mod_set and shader_mod_defines.txt override them by name, live.
# Integer values are uint params, others float.
[params]
# Radius in view units (meters in FM4), picked from a 2x grid (M4).
GTAO_RADIUS = { value = 0.75, min = 0.001 }
# The radius in host pixels at W = 1.
GTAO_RADIUS_PIXELS = { focal_length_of = "GTAO_RADIUS" }
# Fraction of the radius over which occluders fade out.
GTAO_FALLOFF = { value = 0.6, min = 0.01, max = 1.0 }
# Visibility exponent (1: the GTAO integral as is).
GTAO_POWER = { value = 1.5, min = 0.01 }
GTAO_DENOISE_CENTER = 2.0
# Factor of the final occlusion.
GTAO_SCALE = { value = 1.0, min = 0.0, max = 1.0 }
# Output: 0 occlusion, 1 view W over 0-100 units, 2 occlusion before
# denoising, 3 depth discontinuities (the denoise edges), 4 view W over 0-2.
GTAO_DEBUG = { value = 0, min = 0, max = 4 }
# Motion vectors (slot 1) every frame; 0 skips their passes and the stencil
# load.
MOTION_VECTORS = { value = 1, min = 0, max = 1 }
# Drawn over the frame before the HUD (motion.hlsl): 0 off, 1 motion color
# coded, 2 the same over the frame, 3 object slots, 4 object motion alone,
# 5 pixel kinds (interior, world through glass, mask), 6 the motion mask.
MOTION_DEBUG = { value = 0, min = 0, max = 6 }
# Debug views 1, 2 and 4: the motion length in host pixels at full color.
MOTION_DEBUG_PIXELS = { value = 16.0, min = 0.01 }
# The view distance in meters taken for the cockpit interior, whose pixels have
# no depth of their own.
MOTION_INTERIOR_W = { value = 0.6, min = 0.05 }
# A pixel with a car's stencil ID farther than this from the car's origin (in
# meters) is the world seen through the car's glass.
MOTION_OBJECT_RADIUS = { value = 3.0, min = 0.1 }
# Temporal anti-aliasing at the final point (taa.hlsl): 1 runs it and jitters
# the scene draws ([jitter]); off unless the look's taa knob turns it on.
TAA = { value = 0, min = 0, max = 1 }
# 0 keeps TAA without the jitter.
TAA_JITTER = { value = 1, min = 0, max = 1 }
# The jitter only while it pays ([jitter]): while the scene camera moves by at
# least TAA_JITTER_MOTION host pixels per frame (the static world at 10 m), and
# at TAA_JITTER_RATE frames per second or more. With the usual blend, on a
# still camera (rewind, pause, photo mode) and at 30 fps (post-race), TAA's
# clip keeps a residue of every phase and the picture shimmers. 0 turns either
# test off (the jitter of every frame, as before 20 October 2026).
TAA_JITTER_MOTION = { value = 0.5, min = 0.0 }
TAA_JITTER_RATE = { value = 45.0, min = 0.0 }
# 1: the jitter also on a still camera, once it moved less than
# TAA_JITTER_MOTION for 8 frames, at any frame rate, and TAA accumulates the
# phases there (since 20 October 2026): pixels that move less than
# TAA_STILL_PIXELS (host pixels), also reactive ones and those without known
# motion, keep their history and blend the current frame with
# 1 / (frames accumulated + 1), down to
# 1 / TAA_STILL_FRAMES, and clip the history to the 5x5's minimum and maximum
# instead of the 3x3's box of standard deviations, so the phases average out
# into a still, anti-aliased picture. 0: no jitter on a still camera, as from
# the gate's first version of 20 October 2026.
TAA_STILL = { value = 1.0, min = 0.0, max = 1.0 }
TAA_STILL_FRAMES = { value = 256.0, min = 2.0, max = 1024.0 }
TAA_STILL_PIXELS = { value = 0.05, min = 0.0 }
# 1: on a still camera, the luma of each phase's current frame (taa_phases),
# against the same phase a cycle ago (the same samples): a pixel within
# TAA_STILL_CHANGE levels of 255 (gamma 2) for a whole cycle keeps its history
# unclipped, its luma held within that of every phase and of the 5x5, so a
# detail thinner than a pixel, which some phases miss, and a color that some
# phases' 5x5 lacks no longer shimmer; one that changed within the cycle (a
# flag, an animated texture) blends as on a moving camera instead of smearing
# over the frames (since 20 October 2026). 0: the clip of step 8 alone,
# everything still accumulated.
TAA_STILL_PHASES = { value = 1.0, min = 0.0, max = 1.0 }
TAA_STILL_CHANGE = { value = 2.0, min = 0.0, max = 255.0 }
# The weight of the current frame when still, and at TAA_MOTION_PIXELS of
# motion (host pixels).
TAA_BLEND = { value = 0.1, min = 0.01, max = 1.0 }
TAA_BLEND_MOTION = { value = 0.25, min = 0.01, max = 1.0 }
TAA_MOTION_PIXELS = { value = 16.0, min = 0.1 }
# The width of the box the history is clipped to, in standard deviations of
# the 3x3 around the pixel.
TAA_CLIP_GAMMA = { value = 1.0, min = 0.1 }
# The weight of the current frame at least on reactive pixels (car glass).
TAA_REACTIVE = { value = 0.5, min = 0.0, max = 1.0 }
# Sharpening after the resolve (0 to 1); the history stays unsharpened.
TAA_SHARPEN = { value = 0.4, min = 0.0, max = 1.0 }
# Drawn instead of the image (taa.hlsl): 0 off, 1 the history alone, 2 the
# weight of the current frame, 3 the clip, 4 why there is no history, 5 the
# current frame without the jitter, 6 where a still camera's phases accumulate,
# 7 the change of a still camera's phases (green none in the last cycle, red
# changed, blue before a whole cycle).
TAA_DEBUG = { value = 0, min = 0, max = 7 }
# With TAA at the scene_color point: the occlusion accumulated over frames (1)
# and the weight of the current frame when still.
GTAO_TEMPORAL = { value = 1, min = 0, max = 1 }
GTAO_TEMPORAL_BLEND = { value = 0.15, min = 0.01, max = 1.0 }
# AMD FSR 3.1's native anti-aliasing at the scene_color point instead of TAA
# (fsr.hlsl and the pass fsr_upscale; the look's aa=fsr knob): 1 runs it, with
# the jitter of every frame; it stays 0 in a runtime built without FSR
# (REX_FSR), where TAA runs instead. Its RCAS sharpening (the look's sharpen),
# how much of the current frame the car glass takes (motion_mask G, FSR's
# reactive mask), the weight of the pixels without known motion in FSR's
# transparency and composition mask (motion_mask R), FSR's own debug view
# instead of the image (1), and FSR's 16-bit shaders where the GPU has 16-bit
# operations, its default (0: 32-bit ones, an A/B; a new context).
FSR = { value = 0, min = 0, max = 1 }
FSR_SHARPNESS = { value = 0.0, min = 0.0, max = 1.0 }
FSR_REACTIVE = { value = 0.8, min = 0.0, max = 1.0 }
FSR_COMPOSITION = { value = 1.0, min = 0.0, max = 1.0 }
FSR_DEBUG = { value = 0, min = 0, max = 1 }
FSR_FP16 = { value = 1, min = 0, max = 1 }
# The cockpit glass (windshield.hlsl): the strength of all its effects, 0 off
# (the look's windshield knob), and its debug views: 1 the pixel kinds, 2 the
# added light alone, 3 the dust.
WINDSHIELD = { value = 0.0, min = 0.0, max = 2.0 }
WINDSHIELD_DEBUG = { value = 0, min = 0, max = 3 }
# 1 writes a test pattern into the game's scene at the scene_color point
# (scene_pattern.hlsl, the S1 check of the write-back).
SCENE_PATTERN = { value = 0, min = 0, max = 1 }
# Aerial haze (haze.hlsl; the look's haze knob): the strength, 0 off. The
# final combine mixes the scene toward the haze by the amount (fm4_haze in
# work/fm4-rex/look/fm4-look.hlsli); its shape is HAZE_* of [defines].
HAZE = { value = 0.0, min = 0.0, max = 1.0 }

# Textures of the passes, at the size of the scene depth unless scale says
# otherwise. slot exposes one to shader mods (xe_post_texture; slot 0 is
# xe_post_ao), clear zeroes it after every frame it was written in.
[textures.gtao_w]
format = "R32_FLOAT"
mips = 5

[textures.gtao_visibility]
format = "R8_UNORM"

[textures.gtao_visibility_denoised]
format = "R8_UNORM"

[textures.gtao_edges]
format = "R8_UNORM"

[textures.gtao_occlusion]
format = "R8_UNORM"
slot = 0
clear = true

# The motion in host pixels of the scene textures: previous position minus
# this one, in their layout (rotated 180 degrees against the screen).
[textures.motion_vectors]
format = "R16G16_FLOAT"
slot = 1
clear = true

# Where the motion vectors are unknown (R: leave out of the history) or the
# pixel mixes surfaces that move apart (G: reactive), in the scene's layout.
[textures.motion_mask]
format = "R8G8_UNORM"
slot = 2
clear = true

# The aerial haze's amount at each scene pixel, 0 to 1 (haze.hlsl), in the
# scene's layout; the final combine reads it (fm4_post_haze).
[textures.haze_amount]
format = "R8_UNORM"
slot = 3
clear = true

[textures.motion_debug_color]
format = "R8G8B8A8_UNORM"
clear = true

# The TAA output of this frame and the previous one (previous:taa_history):
# linear color, and the frames accumulated in alpha; the size of the final
# color, in screen orientation.
[textures.taa_history]
format = "R16G16B16A16_FLOAT"
size = "final"
history = true

[textures.taa_debug]
format = "R8G8B8A8_UNORM"
size = "final"

# On a still camera (TAA_STILL_PHASES): per phase the luma of the current
# frame, 8 bits each (square root, levels of 255; phases 0 to 3 in R, 4 to 7
# in G), and the frames since the pixel last changed against the same phase a
# cycle ago (255: none seen).
[textures.taa_phases]
format = "R32G32_UINT"
size = "final"
history = true

[textures.taa_unchanged]
format = "R8_UINT"
size = "final"
history = true

# The same at the scene_color point (TAA_POINT 1): the scene's size and
# layout, and the output written back into the game's scene.
[textures.taa_scene_history]
format = "R16G16B16A16_FLOAT"
history = true

[textures.taa_scene_debug]
format = "R8G8B8A8_UNORM"

[textures.taa_scene_out]
format = "R10G10B10A2_UNORM"
write_back = true

# The same as an upscaler (TAA_UPSCALE): at the scene's output size, the output
# written back at the output scale as FSR's is.
[textures.taau_history]
format = "R16G16B16A16_FLOAT"
size = "output"
history = true

[textures.taau_debug]
format = "R8G8B8A8_UNORM"
size = "output"

[textures.taau_out]
format = "R10G10B10A2_UNORM"
size = "output"
write_back = true

# FSR's inputs at the scene_color point (fsr_prepare): the linear color, the
# depth, the reactive and the transparency and composition masks; its output
# (linear), and that output encoded and written back into the game's scene.
# The output is at the scene's output size: above the inputs' while upscaling
# (native_scene_input_scale, docs/analysis/fsr-plan.md 11).
[textures.fsr_color]
format = "R16G16B16A16_FLOAT"

[textures.fsr_depth]
format = "R32_FLOAT"

[textures.fsr_reactive]
format = "R8_UNORM"

[textures.fsr_composition]
format = "R8_UNORM"

[textures.fsr_output]
format = "R16G16B16A16_FLOAT"
size = "output"

# What shader mods mark as reactive with xe_post_mark_reactive (particles that
# ghost under FSR; none yet): bound and cleared every frame only while a mod
# calls the function, else zero; fsr_prepare adds it to FSR's reactive mask.
[textures.reactive_mark]
format = "R8_UNORM"
reactive_mark = true

[textures.fsr_scene_out]
format = "R10G10B10A2_UNORM"
size = "output"
write_back = true

# The cockpit glass (windshield.hlsl), in screen orientation: per block of 8x8
# scene pixels the mean color and share of its interior pixels and of its
# window pixels, the kind of each scene pixel (R window, G interior), the
# interior's share of the frame (one texel), the light the glass adds, and the
# composed frame. The analysis is at the scene's size, which while upscaling is
# the input's (docs/analysis/fsr-plan.md 15), the composition at the final
# size.
[textures.windshield_interior]
format = "R16G16B16A16_FLOAT"
scale = 0.125

[textures.windshield_window]
format = "R16G16B16A16_FLOAT"
scale = 0.125

[textures.windshield_kind]
format = "R8G8_UNORM"

[textures.windshield_frame]
format = "R32_FLOAT"
size = "final"
scale = 0.0001

[textures.windshield_light]
format = "R16G16B16A16_FLOAT"
scale = 0.125

[textures.windshield_out]
format = "R16G16B16A16_FLOAT"
size = "final"

# The light the glass adds (linear, the composed color less final_color) and
# its age, accumulated on a still camera: the window mask and the glare come
# from the jittered scene depth and stencil, after TAA (previous:
# windshield_history in windshield_compose).
[textures.windshield_history]
format = "R16G16B16A16_FLOAT"
size = "final"
history = true

# The occlusion accumulated over frames (gtao_temporal) and the frames in it.
[textures.gtao_history]
format = "R16G16_FLOAT"
history = true

# GTAO after the last scene depth tile is resolved, before the post chain.
[[passes]]
name = "gtao_prefilter"
point = "scene_depth"
shader = "gtao.hlsl"
entry = "gtao_prefilter"
srv = ["scene_depth"]
uav = ["gtao_w:0", "gtao_w:1", "gtao_w:2", "gtao_w:3", "gtao_w:4"]
group = [16, 16]

[[passes]]
name = "gtao_main"
point = "scene_depth"
shader = "gtao.hlsl"
entry = "gtao_main"
srv = ["gtao_w"]
uav = ["gtao_visibility", "gtao_edges"]

# High and ultra denoise twice; debug view 2 shows the visibility before both.
[[passes]]
name = "gtao_denoise"
point = "scene_depth"
shader = "gtao.hlsl"
entry = "gtao_denoise"
if = "GTAO_QUALITY >= 2"
srv = ["gtao_visibility", "gtao_edges", "gtao_w"]
uav = ["gtao_visibility_denoised"]

[[passes]]
name = "gtao_final"
point = "scene_depth"
shader = "gtao.hlsl"
entry = "gtao_denoise"
defines = { GTAO_FINAL = 1 }
if = "GTAO_QUALITY >= 2"
srv = ["gtao_visibility_denoised", "gtao_edges", "gtao_w", "gtao_visibility"]
uav = ["gtao_occlusion"]

[[passes]]
name = "gtao_final_once"
point = "scene_depth"
shader = "gtao.hlsl"
entry = "gtao_denoise"
defines = { GTAO_FINAL = 1 }
if = "GTAO_QUALITY < 2"
srv = ["gtao_visibility", "gtao_edges", "gtao_w", "gtao_visibility"]
uav = ["gtao_occlusion"]

# Motion vectors after GTAO, from the same depth and the stencil of its resolve.
[[passes]]
name = "motion_vectors"
point = "scene_depth"
shader = "motion.hlsl"
entry = "motion_vectors"
if = "MOTION_VECTORS > 0"
srv = ["scene_depth", "scene_stencil"]
uav = ["motion_vectors", "motion_mask"]

[[passes]]
name = "motion_debug"
point = "scene_depth"
shader = "motion.hlsl"
entry = "motion_debug"
if = "MOTION_VECTORS > 0 && MOTION_DEBUG > 0"
srv = ["motion_vectors", "scene_stencil", "scene_depth", "motion_mask"]
uav = ["motion_debug_color"]

# With TAA at the scene_color point, the occlusion over frames: GTAO's of the
# jittered depth moves by sub-pixels each frame, and TAA no longer averages it.
[[passes]]
name = "gtao_temporal"
point = "scene_depth"
shader = "gtao.hlsl"
entry = "gtao_temporal"
if = "TAA > 0 && TAA_POINT > 0 && GTAO_TEMPORAL > 0"
srv = ["gtao_occlusion", "motion_vectors", "motion_mask", "previous:gtao_history",
       "scene_depth", "previous_depth"]
uav = ["gtao_history"]

[[passes]]
name = "gtao_temporal_out"
point = "scene_depth"
shader = "gtao.hlsl"
entry = "gtao_temporal_out"
if = "TAA > 0 && TAA_POINT > 0 && GTAO_TEMPORAL > 0"
srv = ["gtao_history"]
uav = ["gtao_occlusion"]

[[passes]]
name = "haze_amount"
point = "scene_depth"
shader = "haze.hlsl"
entry = "haze_amount"
if = "HAZE > 0"
srv = ["scene_depth"]
uav = ["haze_amount"]

# TAA at the final point, before the HUD: the resolve, then the output drawn
# into final_color (before the motion debug view, which draws over it).
[[passes]]
name = "taa_resolve"
point = "final"
shader = "taa.hlsl"
entry = "taa_resolve"
if = "TAA > 0 && TAA_POINT == 0 && FSR == 0 && XE_SCENE > 0"
srv = ["final_color", "scene_depth", "motion_vectors", "motion_mask", "previous:taa_history",
       "previous_depth", "previous:taa_phases", "previous:taa_unchanged"]
uav = ["taa_history", "taa_debug", "taa_phases", "taa_unchanged"]

[[passes]]
name = "taa_output"
point = "final"
type = "pixel"
shader = "taa.hlsl"
entry = "taa_output"
if = "TAA > 0 && TAA_POINT == 0 && FSR == 0 && XE_SCENE > 0"
srv = ["taa_history", "taa_debug"]
rtv = ["final_color"]

# The cockpit glass at the final point, after TAA (the glass moves with the
# camera, not with the world the motion vectors follow), before the HUD.
[[passes]]
name = "windshield_reduce"
point = "final"
shader = "windshield.hlsl"
entry = "windshield_reduce"
if = "WINDSHIELD > 0 && XE_SCENE > 0"
srv = ["final_color", "scene_depth", "scene_stencil"]
uav = ["windshield_interior", "windshield_window", "windshield_kind"]
group = [1, 1]

[[passes]]
name = "windshield_frame"
point = "final"
shader = "windshield.hlsl"
entry = "windshield_frame"
if = "WINDSHIELD > 0 && XE_SCENE > 0"
srv = ["windshield_interior"]
uav = ["windshield_frame"]
group = [1, 1]

[[passes]]
name = "windshield_light"
point = "final"
shader = "windshield.hlsl"
entry = "windshield_light"
if = "WINDSHIELD > 0 && XE_SCENE > 0"
srv = ["windshield_interior", "windshield_window", "windshield_frame"]
uav = ["windshield_light"]

[[passes]]
name = "windshield_compose"
point = "final"
shader = "windshield.hlsl"
entry = "windshield_compose"
if = "WINDSHIELD > 0 && XE_SCENE > 0"
srv = ["final_color", "windshield_kind", "windshield_light", "windshield_frame",
       "previous:windshield_history"]
uav = ["windshield_out", "windshield_history"]

[[passes]]
name = "windshield_output"
point = "final"
type = "pixel"
shader = "windshield.hlsl"
entry = "windshield_output"
if = "WINDSHIELD > 0 && XE_SCENE > 0"
srv = ["windshield_out"]
rtv = ["final_color"]

# TAA at the scene_color point: the same resolve on the scene, its output
# written back into the game's scene before the post chain.
[[passes]]
name = "taa_scene_resolve"
point = "scene_color"
shader = "taa.hlsl"
entry = "taa_resolve"
defines = { TAA_SCENE = 1 }
if = "TAA > 0 && TAA_POINT > 0 && TAA_UPSCALE == 0 && FSR == 0 && XE_SCENE > 0"
srv = ["scene_color", "scene_depth", "motion_vectors", "motion_mask",
       "previous:taa_scene_history", "previous_depth"]
uav = ["taa_scene_history", "taa_scene_debug"]

[[passes]]
name = "taa_scene_output"
point = "scene_color"
type = "pixel"
shader = "taa.hlsl"
entry = "taa_output"
defines = { TAA_SCENE = 1 }
if = "TAA > 0 && TAA_POINT > 0 && TAA_UPSCALE == 0 && FSR == 0 && XE_SCENE > 0"
srv = ["taa_scene_history", "taa_scene_debug", "scene_color"]
rtv = ["taa_scene_out"]

# TAA as the upscaler at the scene_color point (TAA_UPSCALE): the resolve over
# the output's pixels from the scene at the input scale, and its output written
# back at the output scale.
[[passes]]
name = "taau_resolve"
point = "scene_color"
shader = "taa.hlsl"
entry = "taa_resolve"
defines = { TAA_SCENE = 1, TAA_UPSCALED = 1 }
if = "TAA > 0 && TAA_POINT > 0 && TAA_UPSCALE > 0 && FSR == 0 && XE_SCENE > 0"
srv = ["scene_color", "scene_depth", "motion_vectors", "motion_mask",
       "previous:taau_history", "previous_depth"]
uav = ["taau_history", "taau_debug"]

[[passes]]
name = "taau_output"
point = "scene_color"
type = "pixel"
shader = "taa.hlsl"
entry = "taa_output"
defines = { TAA_SCENE = 1, TAA_UPSCALED = 1 }
if = "TAA > 0 && TAA_POINT > 0 && TAA_UPSCALE > 0 && FSR == 0 && XE_SCENE > 0"
srv = ["taau_history", "taau_debug", "scene_color"]
rtv = ["taau_out"]

# FSR's native anti-aliasing at the scene_color point instead of TAA there:
# its inputs, FSR itself (the runtime's upscaler, a pass of type fsr), and its
# output written back into the game's scene before the post chain.
[[passes]]
name = "fsr_prepare"
point = "scene_color"
shader = "fsr.hlsl"
entry = "fsr_prepare"
if = "FSR > 0 && XE_SCENE > 0"
srv = ["scene_color", "scene_depth", "motion_mask", "reactive_mark"]
uav = ["fsr_color", "fsr_depth", "fsr_reactive", "fsr_composition"]

[[passes]]
name = "fsr_upscale"
point = "scene_color"
type = "fsr"
if = "FSR > 0 && XE_SCENE > 0"
srv = ["fsr_color", "fsr_depth", "motion_vectors", "fsr_reactive", "fsr_composition"]
uav = ["fsr_output"]

[[passes]]
name = "fsr_output"
point = "scene_color"
type = "pixel"
shader = "fsr.hlsl"
entry = "fsr_output"
if = "FSR > 0 && XE_SCENE > 0"
srv = ["fsr_output", "scene_color"]
rtv = ["fsr_scene_out"]

[[passes]]
name = "motion_debug_show"
point = "final"
type = "pixel"
shader = "motion.hlsl"
entry = "motion_debug_show"
if = "MOTION_VECTORS > 0 && MOTION_DEBUG > 0"
srv = ["motion_debug_color"]
rtv = ["final_color"]
blend = "alpha"

# The S1 check of the write-back: the scene with a test pattern, copied into
# the texture cache's host texture of the scene after the scene_color point,
# so the game's bloom, motion blur and final combine sample it.
[textures.scene_written]
format = "R10G10B10A2_UNORM"
write_back = true

[[passes]]
name = "scene_pattern"
point = "scene_color"
type = "pixel"
shader = "scene_pattern.hlsl"
entry = "scene_pattern"
if = "SCENE_PATTERN > 0"
srv = ["scene_color"]
rtv = ["scene_written"]

# The scene draws move by a sub-pixel Halton (2, 3) offset per frame while TAA
# runs, in frames after one in which taa_resolve, taa_scene_resolve,
# taau_resolve or fsr_upscale ran (TAA as the upscaler jitters every frame with
# TAA_JITTER_MOTION and TAA_JITTER_RATE at 0, which the look's aa=taau sets); with FSR in every such frame (every_frame_if), else while
# the scene camera moved by TAA_JITTER_MOTION host pixels (the static world at
# motion_distance meters) in one of the last motion_hold frames and the median
# frame rate is TAA_JITTER_RATE or more, and with TAA_STILL once it has not
# for motion_hold frames (xe_camera_still()).
[jitter]
phases = 8
if = "TAA > 0 && TAA_JITTER > 0"
consumer = ["taa_resolve", "taa_scene_resolve", "taau_resolve", "fsr_upscale"]
every_frame_if = "FSR > 0"
min_motion = "TAA_JITTER_MOTION"
min_frame_rate = "TAA_JITTER_RATE"
still = "TAA_STILL"
motion_distance = 10.0
motion_hold = 8
