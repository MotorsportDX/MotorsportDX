# The native shader contract of the FM4 look (native_shader_contract on the native path,
# docs/analysis/shader-contract.md). Original data of this project: the pass rules name FM4's
# depth surfaces by their EDRAM base and its viewports by their width, and each [[pixel]] entry
# names a mod of this directory for a guest pixel shader by its ucode hash. Without the switch,
# and on RTV, the classic shader_<hash>.mod.hlsli files apply as they are.

# Pass classes after the built-in other, post and hud, for draws that test depth or stencil.
# In one pass (the native path's races) the scene is drawn on the depth surface at EDRAM base
# 1024 in a viewport as wide as the screen (the post passes' scene camera takes 1024 guest
# pixels or more), the rear-view mirror and the cockpit's side mirror on their own depth surface
# at base 80, 384 wide (the log of native_shader_pass_debug, docs/analysis/shader-contract.md).
[[pass]]
name = "scene"
depth_base = 1024
min_viewport_width = 1024

[[pass]]
name = "mirror"  # the rear-view and side mirrors
depth_base = 80

# The car materials of shaders_v16 that races draw into the rear-view and side mirrors as well
# as the scene (fm4-car.hlsli, fm4-paint.hlsli): on the native path most of their draws are in
# the mirror pass (the draw list of 27 October 2026, docs/analysis/shader-contract.md 6). They
# draw there as in the scene (the project owner's decision of 27 October 2026). Their knobs are
# constants, so shader_mod_set changes them at once.

# The car windows (fm4_glass).
[[pixel]]
hash = "E62CFDF09D758B6C"
hooks = "shader_E62CFDF09D758B6C.mod.hlsli"
params = [
  "FM4_LOOK_GLASS",
  "FM4_LOOK_GLASS_ROUGHNESS",
  "FM4_LOOK_CLEARCOAT_GLINT",
]

